# Recipe Book — paste this whole file into Unraid Compose Manager.
# Edit the CHANGE ME lines, then Compose Up.

services:
  db:
    image: postgres:16-alpine
    container_name: recipe-book-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: recipe
      POSTGRES_PASSWORD: recipe
      POSTGRES_DB: recipe_book
    volumes:
      - /mnt/user/appdata/recipe-book/pg:/var/lib/postgresql/data

  app:
    image: ghcr.io/purpleneckjellyfish/recipe-book:latest
    container_name: recipe-book-app
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://recipe:recipe@db:5432/recipe_book?schema=public
      UPLOADS_DIR: /data/uploads
      # CHANGE ME (1): long random string — run on Mac: openssl rand -hex 32
      BETTER_AUTH_SECRET: replace-with-openssl-rand-hex-32
      # CHANGE ME (2): public app URL — Cloudflare tunnel HTTPS if you use one
      BETTER_AUTH_URL: https://recipes.yourdomain.com
      NEXT_PUBLIC_APP_URL: https://recipes.yourdomain.com
      # CHANGE ME (3): all browsers that may open the app (comma-separated, no spaces needed)
      BETTER_AUTH_TRUSTED_ORIGINS: https://recipes.yourdomain.com,http://192.168.1.50:3000
      # CHANGE ME (4): same AI key as your Mac .env — needed for photo→recipe import
      IMPORT_API_KEY: replace-with-your-mistral-or-openai-key
      IMPORT_API_BASE: https://api.mistral.ai/v1
      IMPORT_MODEL: mistral-small-latest
      IMPORT_VISION_MODEL: pixtral-12b-2409
      BACKUPS_DIR: /data/backups
      # CHANGE ME (5): app admin emails (comma-separated) — sees all users in Settings
      ADMIN_EMAILS: davidpkemble@pm.me
    volumes:
      - /mnt/user/appdata/recipe-book/uploads:/data/uploads
      - /mnt/user/appdata/recipe-book/backups:/data/backups
